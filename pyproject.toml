[project]
name = "fog-of-war-chess-bots"
version = "0.1.0"
description = "Bots and local tooling for the MIT 6.7980 Fog of War chess challenge"
requires-python = "==3.14.*"
# Keep these in sync with the arena runtime (starter/requirements.txt and the
# runtime table in starter/README.md; numpy is preinstalled there).
dependencies = [
    "python-chess==1.999",
    "chess==1.11.2",
    "numpy==2.3.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
